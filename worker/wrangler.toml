name = "daoissimple-worker"
main = "index.mjs"
compatibility_date = "2026-10-01"

[vars]
NOTIFY_EMAIL = "dadaoissimple@gmail.com"
GEMINI_MODEL = "gemini-flash-latest"
# 預設寄件人為 Resend 測試寄件人，只能寄到 Resend 帳號本人信箱 (即 dadaoissimple@gmail.com)
MAIL_FROM = "Dao Sanctuary <onboarding@resend.dev>"

# 預約紀錄 (建議)：先執行  npx wrangler kv namespace create BOOKINGS
# 再把輸出的 id 貼到下方並取消註解
# [[kv_namespaces]]
# binding = "BOOKINGS"
# id = "貼上 KV namespace id"

# Secrets 不寫在此檔，請用指令設定 (見 worker/README.md)：
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put RESEND_API_KEY
