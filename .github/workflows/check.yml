name: Check Dao Sanctuary Rules

# 任何分支推送與 PR 都會跑鐵律檢查 (貨幣分流、標題標點、emoji、直角、字重、錨點)
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install opencc-python-reimplemented
      - name: Build Simplified Chinese version
        run: python tools/build_zhcn.py
      - name: Check design and content rules
        run: python tools/check.py
      - name: Syntax check frontend
        run: node --check js/app.js
      - name: Verify generated files are up to date
        run: |
          # 簡體版、長文獨立頁、sitemap、feed、robots 與 index.html 的 SEO 區塊都是編譯結果；
          # 改了來源卻沒重新執行 python3 tools/build_zhcn.py 時，這裡會失敗
          out="$(git status --porcelain -- zh-cn articles sitemap.xml feed.xml robots.txt index.html)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::編譯結果與已提交的檔案不一致，請在本機執行 python3 tools/build_zhcn.py 並提交"
            exit 1
          fi
