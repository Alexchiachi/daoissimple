name: Check Dao Sanctuary Rules

# 任何分支推送與 PR 都會跑鐵律檢查 (貨幣分流、標題標點、emoji、直角、字重、錨點)
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install opencc-python-reimplemented
      - name: Build Simplified Chinese version
        run: python tools/build_zhcn.py
      - name: Check design and content rules
        run: python tools/check.py
      - name: Syntax check frontend
        run: node --check js/app.js
      - name: Test Cloudflare Worker
        run: node --test worker/index.test.mjs
      - name: Verify zh-cn is up to date
        run: git diff --exit-code -- zh-cn/index.html
